# Define the machine's Router ID (BIRD requires a unique 32-bit number, usually matching an IP)
router id 127.0.0.1; 

# The Kernel protocol syncs BIRD's calculated routes with the operating system kernel
protocol kernel {
    ipv6 {
        import all;     # Learn any routes the kernel already knows (like the internet link)
        export all;     # Push BIRD's discovered routes back into the kernel table
    };
}

# The Device protocol monitors physical network interfaces as they come online
protocol device {
}

# The OSPFv3 protocol handles the plug-and-play, secured IPv6 routing matrix
protocol ospf v3 intranet_mesh {
    ipv6 {
        # FIX 1 & 3 (PEER POLICIES / INBOUND FILTERS): 
        # Only accept the internet default route (::/0) from neighbors.
        # This completely stops a rogue machine from injecting malicious internal paths.
        import filter {
            if net = ::/0 then accept;
            reject;
        };

        # Only export a default route if this specific machine physically holds the real internet link.
        export filter {
            if net = ::/0 then accept;
            reject;
        };
    };

    area 0.0.0.0 {
        # FIX 2 (PLUG-AND-PLAY NEIGHBOR DISCOVERY WITH AUTHC):
        # Wildcard applies to eth0, eth1, etc. dynamically as cables are plugged in.
        interface "e*" {      
            type pointopoint;   # Highly efficient for direct machine-to-machine cables
            hello 2;           # Send a neighbor discovery packet every 2 seconds
            dead 6;            # Drop a neighbor if it goes silent for 6 seconds

            # FIX 1 (ANTI-LIE METRIC):
            # Enforce a hard cost of 100 on all automatically discovered ports.
            # Even if a rogue machine claims a zero-cost path, this local machine overrides it.
            cost 100;

            # FIX 2 (CRYPTOGRAPHIC PASSWORDS):
            # Secures the multicast discovery channel. Only machines sharing this exact 
            # key can form an OSPFv3 peering relationship.
            authentication cryptographic;
            password "SecureIntranetMeshKey123" {
                id 1;
                algorithm hmac sha256; # Enterprise-grade cryptographic hashing
            };
        };
    };
}
