server:
    # 1. NETWORKING & INTERFACES
    # Listen on all available network interfaces (internal mesh and loopback)
    interface: ::0
    interface: 127.0.0.1
    interface: ::1

    # Port to listen on (Standard DNS port)
    port: 53

    # Enable native IPv6 protocol support
    do-ip6: yes
    # Disable IPv4 upstream queries since our network drops outbound IPv4 transit
    do-ip4: no

    # 2. SECURITY & ACCESS CONTROL
    # Default Policy: Refuse everything from the public internet
    access-control: ::/0 refuse

    # Trust Policy: Explicitly allow your local machine and your internal 
    # plug-and-play network blocks to perform DNS queries
    access-control: ::1 allow
    access-control: 127.0.0.1 allow
    access-control: fe80::/10 allow   # Explicitly allows all IPv6 Link-Local neighbors

    # 3. DNSSEC & VALIDATION
    # Enable automatic cryptographic DNSSEC validation
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    module-config: "validator iterator"

    # Harden against cache poisoning attempts and spoofing
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes

    # 4. PRIVACY
    # Hide software version details from network scanners
    hide-identity: yes
    hide-version: yes
    qname-minimization: yes

